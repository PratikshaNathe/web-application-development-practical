
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        form {
            background: #f7f8ff;
            padding: 25px;
            border-radius: 18px;
            border: 1px solid #e4e6ff;
            margin-bottom: 35px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: #ffffff;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        input::placeholder {
            color: #999;
        }

        button {
            padding: 13px 25px;
            margin-top: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.97);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        th,
        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            font-size: 15px;
        }

        td {
            background: #ffffff;
            color: #444;
        }

        tr:hover td {
            background: #f5f6ff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .deleteBtn {
            background: #e74c3c;
            padding: 8px 15px;
            margin: 0;
            border-radius: 8px;
            box-shadow: none;
        }

        .deleteBtn:hover {
            background: #c0392b;
            box-shadow: 0 5px 12px rgba(231, 76, 60, 0.3);
        }

        hr {
            border: none;
            height: 2px;
            background: #eeeeee;
            margin: 40px 0;
        }

        #users {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            width: 250px;
            padding: 22px;
            border-radius: 18px;
            background: linear-gradient(145deg, #ffffff, #f5f6ff);
            border: 1px solid #e5e6ff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 21px;
        }

        .card p {
            color: #555;
            font-size: 14px;
            margin: 10px 0;
            line-height: 1.5;
        }

        .card b {
            color: #333;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                padding: 20px;
                border-radius: 18px;
            }

            h2 {
                font-size: 23px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Registration Portal</h2>

        <form id="studentForm">
            <input type="text" id="name" placeholder="Enter your Name">
            <input type="text" id="roll" placeholder="Enter your Roll Number">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="course" placeholder="Course">
            <input type="text" id="mobile" placeholder="Mobile Number">
            <button type="submit">Register</button>
        </form>

        <h2>Registered Students</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Mobile</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>

        <hr>

        <h2>Users from Local Storage</h2>

        <button onclick="loadUsers()">Load Users</button>

        <div id="users"></div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        const LS = key => JSON.parse(localStorage.getItem(key)) || [];

        const setLS = (key, data) =>
            localStorage.setItem(key, JSON.stringify(data));

        const form = $('studentForm');

        const table = $('studentTable');

        const render = () => {
            const students = LS('students');

            table.innerHTML = students.map((s, index) =>
                `<tr>
                    <td>${s.name}</td>
                    <td>${s.roll}</td>
                    <td>${s.email}</td>
                    <td>${s.course}</td>
                    <td>${s.mobile}</td>
                    <td>
                        <button class="deleteBtn" onclick="deleteStudent(${index})">
                            Delete
                        </button>
                    </td>
                </tr>`
            ).join('');
        };

        render();

        form.addEventListener('submit', e => {
            e.preventDefault();

            const [name, roll, email, course, mobile] =
                ['name', 'roll', 'email', 'course', 'mobile']
                .map(id => $(id).value.trim());

            if (!name || !roll || !email || !course || !mobile) {
                return alert('All fields required');
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                return alert('Invalid Email');
            }

            if (!/^[0-9]{10}$/.test(mobile)) {
                return alert('Enter 10 digit mobile number');
            }

            let students = LS('students');

            students.push({
                name,
                roll,
                email,
                course,
                mobile
            });

            setLS('students', students);

            form.reset();

            render();

            alert('Student registered successfully!');
        });

        window.deleteStudent = index => {
            let students = LS('students');

            if (confirm('Are you sure you want to delete this student?')) {
                students.splice(index, 1);

                setLS('students', students);

                render();

                loadUsers();

                alert('Student deleted successfully!');
            }
        };

        window.loadUsers = () => {
            const students = LS('students');

            const container = $('users');

            container.innerHTML = students.length === 0
                ? '<p>No registered students found.</p>'
                : students.map(s =>
                    `<div class="card">
                        <h3>${s.name}</h3>
                        <p><b>Roll:</b> ${s.roll}</p>
                        <p><b>Email:</b> ${s.email}</p>
                        <p><b>Course:</b> ${s.course}</p>
                        <p><b>Mobile:</b> ${s.mobile}</p>
                    </div>`
                ).join('');
        };
    </script>
</body>
</html>
